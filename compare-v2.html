<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership 360° – C1 / C2 comparison</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>.topbar{max-width:900px;margin:0 auto;padding:10px 20px;display:flex;justify-content:flex-end}.lang-btn{min-width:48px;padding:7px 12px}.delta-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.dcard{padding:14px;border:1px solid var(--border);border-radius:12px;text-align:center}.dval{font-size:1.8rem;font-weight:700}.dlbl{font-size:.72rem;color:var(--muted);margin-top:4px}.delta-table{width:100%;border-collapse:collapse}.delta-table th,.delta-table td{padding:8px;border-bottom:1px solid var(--border);text-align:left;font-size:.84rem}.pos{color:var(--accent)}.neg{color:var(--danger)}@media(max-width:650px){.delta-stat{grid-template-columns:repeat(2,1fr)}}</style>
</head>
<body>
<div class="topbar"><button id="langToggle" type="button" class="secondary lang-btn">EN</button></div>
<header class="head"><h1 id="headTitle"></h1><p id="headSub"></p></header>
<main class="wrap">
  <section class="card no-print"><h2 id="title">C1 → C2</h2><p><strong id="aid">—</strong></p><div class="grid4 mt"><label><span id="bossLabel"></span><input type="number" id="wBoss" min="0" max="1" step="0.05" value="0.30"></label><label><span id="peerLabel"></span><input type="number" id="wPeers" min="0" max="1" step="0.05" value="0.30"></label><label><span id="reportLabel"></span><input type="number" id="wReports" min="0" max="1" step="0.05" value="0.30"></label><label><span id="otherLabel"></span><input type="number" id="wOthers" min="0" max="1" step="0.05" value="0.10"></label></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="loadBtn" type="button"></button><a id="guardianLink" class="btn secondary" href="#"></a><a id="privacyLink" class="btn secondary" target="_blank" rel="noopener"></a></div><div id="status" class="muted" style="margin-top:9px"></div></section>
  <div id="results" style="display:none"><div id="stats" class="delta-stat"></div><section class="card"><h2 id="radarTitle"></h2><div style="max-width:600px;margin:auto"><canvas id="radar"></canvas></div></section><div class="grid2"><section class="card"><h2 id="upTitle"></h2><div id="topUp"></div></section><section class="card"><h2 id="downTitle"></h2><div id="topDown"></div></section></div><section class="card"><h2 id="allTitle"></h2><div style="overflow:auto"><table class="delta-table"><thead><tr><th id="thComp"></th><th>C1 Others</th><th>C2 Others</th><th>Δ</th><th id="thTrend"></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card no-print"><h2 id="nextTitle"></h2><p id="nextNote" class="muted"></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="goPlan" type="button"></button><button id="saveDelta" type="button" class="secondary"></button></div></section></div>
</main>
<script src="app.js"></script><script src="v2-i18n.js"></script><script src="collector-client.js?v=20260821-c2-compare2"></script>
<script>
(function(){
 const I=window.Leadership360I18n,C=window.Leadership360Collector;let auth=C.parseManageHash(),delta=null,agg1=null,agg2=null,bank=null;if(!auth.assessmentId||!auth.manageToken){try{const x=JSON.parse(sessionStorage.getItem('leadership360_last_manage')||'null');if(x)auth=x}catch(e){}}
 let lang=I.set(auth.lang||I.current(),{syncHash:true});auth.lang=lang;
 const COPY={lt:{head:'Leadership 360° – Pokytis',sub:'C1 ir C2 palyginami tiesiogiai iš Collector',boss:'Vadovas',peer:'Kolegos',report:'Pavaldiniai',other:'Kiti',load:'📈 Skaičiuoti C1 → C2',guardian:'← Ciklo valdymas',privacy:'🔒 Privatumas',radar:'Others C1 vs C2',up:'↑ Labiausiai pagerėjo',down:'↓ Labiausiai pablogėjo',all:'Visos sritys',comp:'Gebėjimas',trend:'Kryptis',next:'Kitas 90 d. ciklas',note:'Delta į planą perduodama per naršyklės sesiją. Raw 360° atsakymai į planą ar Telegram nepatenka.',plan:'📋 Generuoti adaptuotą planą →',save:'⬇ Atsisiųsti delta.json',stats:{up:'Pagerėjo',same:'Nepasikeitė',down:'Pablogėjo',avg:'Vid. Δ'},noneUp:'Aiškiai pagerėjusių sričių nėra.',noneDown:'Pablogėjusių sričių nėra.',trends:{improved:'Aiškiai pagerėjo',mild_improved:'Pagerėjo',stagnated:'Nepasikeitė',regressed:'Pablogėjo',first_time:'Pirmas ciklas'},loading:'Kraunami C1 ir C2…',need:'Palyginimui reikia bent po vieną C1 ir C2 atsakymą.',loaded:(a,b)=>`C1: ${a} ats. · C2: ${b} ats.`,error:'Palyginimo klaida: '},en:{head:'Leadership 360° – Change',sub:'C1 and C2 are compared directly from the Collector',boss:'Manager',peer:'Peers',report:'Direct reports',other:'Others',load:'📈 Calculate C1 → C2',guardian:'← Cycle management',privacy:'🔒 Privacy',radar:'Others C1 vs C2',up:'↑ Most improved',down:'↓ Most regressed',all:'All competency areas',comp:'Competency',trend:'Trend',next:'Next 90-day cycle',note:'The delta is passed to the plan through the browser session. Raw 360° responses do not go to the plan or Telegram.',plan:'📋 Generate adapted plan →',save:'⬇ Download delta.json',stats:{up:'Improved',same:'Unchanged',down:'Regressed',avg:'Avg. Δ'},noneUp:'No clearly improved areas.',noneDown:'No regressed areas.',trends:{improved:'Clearly improved',mild_improved:'Improved',stagnated:'Unchanged',regressed:'Regressed',first_time:'First cycle'},loading:'Loading C1 and C2…',need:'At least one response in both C1 and C2 is required.',loaded:(a,b)=>`C1: ${a} responses · C2: ${b} responses`,error:'Comparison error: '}};
 function t(){return COPY[lang]}function name(n){return lang==='lt'?GLA.lt(n):n}document.getElementById('aid').textContent=auth.assessmentId||'—';const status=document.getElementById('status');function weights(){return{boss:Number(document.getElementById('wBoss').value)||0,peer:Number(document.getElementById('wPeers').value)||0,report:Number(document.getElementById('wReports').value)||0,other:Number(document.getElementById('wOthers').value)||0}}function packs(b){return(b.responses||[]).map(r=>({role:String(r.role||'other').toUpperCase(),answers:r.answers,open:r.open||{}}))}
 function renderStatic(){const x=t();document.documentElement.lang=lang;document.title=x.head;document.getElementById('headTitle').textContent=x.head;document.getElementById('headSub').textContent=x.sub;document.getElementById('bossLabel').textContent=x.boss;document.getElementById('peerLabel').textContent=x.peer;document.getElementById('reportLabel').textContent=x.report;document.getElementById('otherLabel').textContent=x.other;document.getElementById('loadBtn').textContent=x.load;document.getElementById('guardianLink').textContent=x.guardian;document.getElementById('guardianLink').href=C.guardianUrl({...auth,cycle:2});document.getElementById('privacyLink').textContent=x.privacy;document.getElementById('privacyLink').href=C.privacyUrl(lang);document.getElementById('radarTitle').textContent=x.radar;document.getElementById('upTitle').textContent=x.up;document.getElementById('downTitle').textContent=x.down;document.getElementById('allTitle').textContent=x.all;document.getElementById('thComp').textContent=x.comp;document.getElementById('thTrend').textContent=x.trend;document.getElementById('nextTitle').textContent=x.next;document.getElementById('nextNote').textContent=x.note;document.getElementById('goPlan').textContent=x.plan;document.getElementById('saveDelta').textContent=x.save}
 I.bindToggle(document.getElementById('langToggle'),next=>{lang=next;auth.lang=next;I.set(next,{syncHash:true});renderStatic();if(delta)render()},{syncHash:true});renderStatic();
 function render(){const x=t(),s=delta.summary;document.getElementById('stats').innerHTML=`<div class="dcard"><div class="dval">${s.improved}</div><div class="dlbl">${x.stats.up}</div></div><div class="dcard"><div class="dval">${s.stagnated}</div><div class="dlbl">${x.stats.same}</div></div><div class="dcard"><div class="dval">${s.regressed}</div><div class="dlbl">${x.stats.down}</div></div><div class="dcard"><div class="dval">${s.avgDelta===null?'—':(s.avgDelta>=0?'+':'')+s.avgDelta.toFixed(2)}</div><div class="dlbl">${x.stats.avg}</div></div>`;document.getElementById('topUp').innerHTML=delta.topImproved.length?delta.topImproved.map(v=>`<p><strong>${name(v.name)}</strong> <span class="pos">+${v.delta_others.toFixed(2)}</span></p>`).join(''):`<p class="muted">${x.noneUp}</p>`;document.getElementById('topDown').innerHTML=delta.topRegressed.length?delta.topRegressed.map(v=>`<p><strong>${name(v.name)}</strong> <span class="neg">${v.delta_others.toFixed(2)}</span></p>`).join(''):`<p class="muted">${x.noneDown}</p>`;document.getElementById('rows').innerHTML=delta.items.map(v=>`<tr><td>${name(v.name)}</td><td>${v.c1_others===null?'—':v.c1_others.toFixed(2)}</td><td>${v.c2_others===null?'—':v.c2_others.toFixed(2)}</td><td class="${(v.delta_others||0)>=0?'pos':'neg'}">${v.delta_others===null?'—':(v.delta_others>=0?'+':'')+v.delta_others.toFixed(2)}</td><td>${v.trendLabel?.icon||''} ${x.trends[v.trend]||v.trend}</td></tr>`).join('');if(window.Chart){const old=Chart.getChart('radar');if(old)old.destroy();new Chart(document.getElementById('radar'),{type:'radar',data:{labels:bank.competencies.map(c=>name(c.name)),datasets:[{label:'Others C1',data:agg1.others.map(v=>v||0),fill:false},{label:'Others C2',data:agg2.others.map(v=>v||0),fill:false}]},options:{scales:{r:{min:1,max:5,ticks:{stepSize:1}}}}})}document.getElementById('results').style.display='block'}
 async function load(){const x=t();status.textContent=x.loading;try{const[b1,b2,bk]=await Promise.all([C.exportCycle(auth.assessmentId,1,auth.manageToken),C.exportCycle(auth.assessmentId,2,auth.manageToken),GLA.loadBank()]);if(!b1.responses?.length||!b2.responses?.length){status.textContent=x.need;return}bank=bk;agg1=GLA.aggregate(bank,packs(b1),weights());agg2=GLA.aggregate(bank,packs(b2),weights());agg1.cycle=1;agg2.cycle=2;delta=GLA.compareAggregates(agg1,agg2);delta.assessment_id=auth.assessmentId;delta.schema='leadership360-compare@2';render();status.textContent=x.loaded(b1.responses.length,b2.responses.length)}catch(e){status.textContent=x.error+e.message}}
 document.getElementById('loadBtn').onclick=load;['wBoss','wPeers','wReports','wOthers'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{if(delta)load()}));document.getElementById('saveDelta').onclick=()=>{if(delta)GLA.download(`leadership360_delta_${auth.assessmentId}_C1-C2.json`,delta)};document.getElementById('goPlan').onclick=()=>{if(!delta)return;sessionStorage.setItem('gla360_delta',JSON.stringify(delta));location.href='plan.html?lang='+encodeURIComponent(lang)};load();
})();
</script>
</body>
</html>
