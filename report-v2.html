<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership 360° – Cycle report</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>.topbar{max-width:900px;margin:0 auto;padding:10px 20px;display:flex;justify-content:flex-end}.lang-btn{min-width:48px;padding:7px 12px}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}.stat-val{font-size:1.65rem;font-weight:700}.stat-lbl{font-size:.72rem;color:var(--muted);margin-top:4px}.bar-row{margin:12px 0}.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:.85rem}.track{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--brand)}.comment{padding:10px 0;border-bottom:1px solid var(--border)}.radar-wrap{max-width:760px;margin:auto}.radar-note{font-size:.78rem;margin-top:8px;text-align:center;color:var(--muted)}@media(max-width:650px){.stat-row{grid-template-columns:repeat(2,1fr)}.radar-wrap{max-width:100%}}</style>
</head>
<body>
<div class="topbar"><button id="langToggle" type="button" class="secondary lang-btn">EN</button></div>
<header class="head"><h1 id="headTitle"></h1><p id="subtitle"></p></header>
<main class="wrap">
  <section class="card no-print"><h2 id="sourceTitle"></h2><p><strong id="aid">—</strong> · <strong id="cycle">C1</strong></p><div class="grid4 mt"><label><span id="wBossLabel"></span><input type="number" id="wBoss" min="0" max="1" step="0.05" value="0.30"></label><label><span id="wPeersLabel"></span><input type="number" id="wPeers" min="0" max="1" step="0.05" value="0.30"></label><label><span id="wReportsLabel"></span><input type="number" id="wReports" min="0" max="1" step="0.05" value="0.30"></label><label><span id="wOthersLabel"></span><input type="number" id="wOthers" min="0" max="1" step="0.05" value="0.10"></label></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="loadBtn" type="button"></button><a id="backGuardian" class="btn secondary" href="#"></a><a id="privacyLink" class="btn secondary" target="_blank" rel="noopener"></a></div><div id="loadStatus" class="muted" style="margin-top:9px"></div></section>
  <div id="results" style="display:none"><div id="stats" class="stat-row"></div><section class="card"><h2 id="privacyTitle"></h2><div id="privacyWarnings"></div></section><section class="card"><h2 id="radarTitle"></h2><div class="radar-wrap"><canvas id="radar"></canvas><p id="radarMissingNote" class="radar-note" style="display:none"></p></div></section><section class="card"><h2 id="clustersTitle"></h2><div id="clusters"></div></section><div class="grid2"><section class="card"><h2 id="strengthsTitle"></h2><ol id="strengths" class="sg-list"></ol></section><section class="card"><h2 id="gapsTitle"></h2><ol id="gaps" class="sg-list"></ol></section></div><section class="card"><h2 id="areasTitle"></h2><div id="compBars"></div></section><section class="card"><h2 id="commentsTitle"></h2><div id="comments"></div></section><section class="card no-print"><h2 id="nextTitle"></h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="saveAgg" type="button"></button><a href="plan.html" id="planLink" class="btn" style="background:var(--accent)"></a><button onclick="window.print()" id="printBtn" class="secondary"></button></div><p id="transitionNote" class="muted" style="font-size:.82rem;margin-top:8px"></p></section></div>
</main>
<script src="app.js"></script><script src="v2-i18n.js"></script><script src="collector-client.js?v=20260820-4"></script>
<script>
(function(){
 const I=window.Leadership360I18n,C=window.Leadership360Collector;let auth=C.parseManageHash(),bundle=null,agg=null,bank=null;if(!auth.assessmentId||!auth.manageToken){try{const x=JSON.parse(sessionStorage.getItem('leadership360_last_manage')||'null');if(x)auth=x}catch(e){}}
 let lang=I.set(auth.lang||I.current(),{syncHash:true});auth.lang=lang;
 const COPY={lt:{head:'Leadership 360° – Ataskaita',sub:'Pseudoniminio ciklo rezultatai',source:'Ciklo šaltinis',boss:'Vadovas',peers:'Kolegos',reports:'Pavaldiniai',others:'Kiti',load:'📊 Įkelti ciklą ir skaičiuoti',back:'← Ciklo valdymas',privacyLink:'🔒 Privatumas',privacy:'Anonimiškumo patikra',radar:'Radaras: savivertinimas ir kitų vertinimas',clusters:'Sričių vidurkiai',strengths:'💪 Top 3 stiprybės',gaps:'🎯 Top 3 spragos',areas:'Gebėjimų sritys',comments:'💬 Atviri komentarai',next:'Toliau',save:'⬇ Atsisiųsti apibendrintą JSON',plan:'📋 90 d. planas →',print:'🖨 PDF',transition:'Apibendrintas JSON lieka atsarginis/perėjimo formatas. Normalus kelias skaito ciklą tiesiai iš Collector.',stats:{responses:'Atsakymai',self:'SELF',others:'KITI',skills:'Gebėjimai'},noSelf:'⚠️ Nėra SELF atsakymo – savivertinimo ir kitų palyginimas bus nepilnas.',peerWarn:'⚠️ Kolegų n < 3. Rolės lygmens interpretaciją vertinkite atsargiai.',reportWarn:'⚠️ Pavaldinių n < 3. Rolės lygmens interpretaciją vertinkite atsargiai.',otherWarn:'⚠️ „Kiti“ n = 1.',privacyOk:'✓ Pagrindinės grupių anonimiškumo ribos pasiektos.',safe:{self:'SELF',boss:'Vadovas',peer:'Kolegos',report:'Pavaldiniai',other:'Kiti',merged:'Kiti'},strengthType:'Stiprybės',developType:'Tobulinti',noComments:'Atvirų komentarų nėra.',missingKey:'Trūksta valdymo rakto.',loading:'Kraunama…',empty:'Šiame cikle dar nėra atsakymų.',loaded:n=>`Įkelta ${n} atsakymų.`,error:'Ataskaitos klaida: ',radarSelf:'Savivertinimas',radarOthers:'Kiti',radarMissing:'— = neįvertinta. Trūkstama reikšmė radare nėra piešiama kaip 0.'},en:{head:'Leadership 360° – Report',sub:'Pseudonymous cycle results',source:'Cycle source',boss:'Manager',peers:'Peers',reports:'Direct reports',others:'Others',load:'📊 Load cycle and calculate',back:'← Cycle management',privacyLink:'🔒 Privacy',privacy:'Anonymity check',radar:'Radar: self-assessment vs others',clusters:'Cluster averages',strengths:'💪 Top 3 strengths',gaps:'🎯 Top 3 gaps',areas:'Competency areas',comments:'💬 Open comments',next:'Next',save:'⬇ Download aggregate JSON',plan:'📋 90-day plan →',print:'🖨 PDF',transition:'Aggregate JSON remains a fallback/transition format. The normal path reads a cycle directly from the Collector.',stats:{responses:'Responses',self:'SELF',others:'OTHERS',skills:'Competencies'},noSelf:'⚠️ SELF response is missing – self-assessment vs others comparison will be incomplete.',peerWarn:'⚠️ Peer n < 3. Interpret role-level results cautiously.',reportWarn:'⚠️ Direct-report n < 3. Interpret role-level results cautiously.',otherWarn:'⚠️ Other n = 1.',privacyOk:'✓ Main group anonymity thresholds are met.',safe:{self:'SELF',boss:'Manager',peer:'Peers',report:'Direct reports',other:'Others',merged:'Others'},strengthType:'Strength',developType:'Develop',noComments:'No open comments.',missingKey:'Management key is missing.',loading:'Loading…',empty:'There are no responses in this cycle yet.',loaded:n=>`Loaded ${n} responses.`,error:'Report error: ',radarSelf:'Self-assessment',radarOthers:'Others',radarMissing:'— = not assessed. Missing values are not plotted as zero.'}};
 function t(){return COPY[lang]}function name(comp){return lang==='lt'?GLA.lt(comp):comp}
 document.getElementById('aid').textContent=auth.assessmentId||'—';document.getElementById('cycle').textContent='C'+(auth.cycle||1);const status=document.getElementById('loadStatus');
 function renderStatic(){const x=t();document.documentElement.lang=lang;document.title=x.head;document.getElementById('headTitle').textContent=x.head;document.getElementById('subtitle').textContent=x.sub;document.getElementById('sourceTitle').textContent=x.source;document.getElementById('wBossLabel').textContent=x.boss;document.getElementById('wPeersLabel').textContent=x.peers;document.getElementById('wReportsLabel').textContent=x.reports;document.getElementById('wOthersLabel').textContent=x.others;document.getElementById('loadBtn').textContent=x.load;document.getElementById('backGuardian').textContent=x.back;document.getElementById('backGuardian').href=C.guardianUrl(auth);document.getElementById('privacyLink').textContent=x.privacyLink;document.getElementById('privacyLink').href=C.privacyUrl(lang);document.getElementById('privacyTitle').textContent=x.privacy;document.getElementById('radarTitle').textContent=x.radar;document.getElementById('clustersTitle').textContent=x.clusters;document.getElementById('strengthsTitle').textContent=x.strengths;document.getElementById('gapsTitle').textContent=x.gaps;document.getElementById('areasTitle').textContent=x.areas;document.getElementById('commentsTitle').textContent=x.comments;document.getElementById('nextTitle').textContent=x.next;document.getElementById('saveAgg').textContent=x.save;document.getElementById('planLink').textContent=x.plan;document.getElementById('printBtn').textContent=x.print;document.getElementById('transitionNote').textContent=x.transition}
 I.bindToggle(document.getElementById('langToggle'),next=>{lang=next;auth.lang=next;I.set(next,{syncHash:true});renderStatic();if(bundle)renderAll()},{syncHash:true});renderStatic();
 const roleCounts=()=>{const c={self:0,boss:0,peer:0,report:0,other:0};(bundle?.responses||[]).forEach(r=>{if(c[r.role]!==undefined)c[r.role]++});return c};function weights(){return{boss:Number(document.getElementById('wBoss').value)||0,peer:Number(document.getElementById('wPeers').value)||0,report:Number(document.getElementById('wReports').value)||0,other:Number(document.getElementById('wOthers').value)||0}}
 function renderStats(){const x=t(),c=roleCounts(),all=bundle.responses.length;document.getElementById('stats').innerHTML=`<div class="stat-card"><div class="stat-val">${all}</div><div class="stat-lbl">${x.stats.responses}</div></div><div class="stat-card"><div class="stat-val">${c.self}</div><div class="stat-lbl">${x.stats.self}</div></div><div class="stat-card"><div class="stat-val">${c.peer+c.report+c.boss+c.other}</div><div class="stat-lbl">${x.stats.others}</div></div><div class="stat-card"><div class="stat-val">${bank.competencies.length}</div><div class="stat-lbl">${x.stats.skills}</div></div>`}
 function renderPrivacy(){const x=t(),c=roleCounts(),w=[];if(c.self<1)w.push(x.noSelf);if(c.peer>0&&c.peer<3)w.push(x.peerWarn);if(c.report>0&&c.report<3)w.push(x.reportWarn);if(c.other===1)w.push(x.otherWarn);document.getElementById('privacyWarnings').innerHTML=w.length?w.map(s=>`<p>${s}</p>`).join(''):`<p>${x.privacyOk}</p>`}
 function renderBars(){document.getElementById('compBars').innerHTML=bank.competencies.map((comp,i)=>{const s=agg.means.self[i],o=agg.others[i];return `<div class="bar-row"><div class="bar-label"><strong>${name(comp.name)}</strong><span>Self ${s!==null?s.toFixed(2):'—'} · Others ${o!==null?o.toFixed(2):'—'}</span></div><div class="track"><div class="fill" style="width:${o!==null?o/5*100:0}%"></div></div></div>`}).join('')}
 function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function renderComments(){const x=t(),c=roleCounts(),safe=r=>r==='self'?x.safe.self:r==='boss'?x.safe.boss:(r==='peer'&&c.peer>=3)?x.safe.peer:(r==='report'&&c.report>=3)?x.safe.report:(r==='other'&&c.other>=2)?x.safe.other:x.safe.merged,items=agg.comments||[];document.getElementById('comments').innerHTML=items.length?items.map(v=>`<div class="comment"><strong>${safe(v.role)}</strong> · <span class="muted">${v.type==='strengths'?x.strengthType:x.developType}</span><div style="margin-top:4px">${escapeHtml(v.text)}</div></div>`).join(''):`<p class="muted">${x.noComments}</p>`}
 function renderStrengthsGaps(){const s=document.getElementById('strengths'),g=document.getElementById('gaps');s.innerHTML=(agg.strengths||[]).map(v=>`<li><strong>${name(v.name)}</strong> <span class="muted">${v.diff>=0?'+':''}${v.diff.toFixed(2)}</span></li>`).join('');g.innerHTML=(agg.gaps||[]).map(v=>`<li><strong>${name(v.name)}</strong> <span class="muted">${v.diff.toFixed(2)}</span></li>`).join('')}
 function renderClusters(){document.getElementById('clusters').innerHTML=bank.competencies.reduce((html,comp,i)=>{const s=agg.means.self[i],o=agg.others[i];return html+`<div class="bar-row"><div class="bar-label"><strong>${name(comp.name)}</strong><span>${s!==null?s.toFixed(2):'—'} / ${o!==null?o.toFixed(2):'—'}</span></div></div>`},'')}
 function renderRadar(){if(!window.Chart||!bank||!agg)return;const canvas=document.getElementById('radar');const old=Chart.getChart(canvas);if(old)old.destroy();const mobile=window.matchMedia('(max-width:650px)').matches;const val=v=>(v===null||v===undefined||!Number.isFinite(Number(v)))?null:Number(v);const self=agg.means.self.map(val),others=agg.others.map(val);const hasMissing=self.some(v=>v===null)||others.some(v=>v===null);new Chart(canvas,{type:'radar',data:{labels:bank.competencies.map(c=>name(c.name)),datasets:[{label:t().radarSelf,data:self,fill:true,spanGaps:false},{label:t().radarOthers,data:others,fill:true,spanGaps:false}]},options:{responsive:true,maintainAspectRatio:true,layout:{padding:mobile?8:28},plugins:{legend:{display:true}},scales:{r:{min:1,max:5,ticks:{stepSize:1},pointLabels:{display:!mobile}}}}});const note=document.getElementById('radarMissingNote');note.textContent=hasMissing?t().radarMissing:'';note.style.display=hasMissing?'block':'none'}
 function renderAll(){renderStats();renderPrivacy();renderRadar();renderClusters();renderStrengthsGaps();renderBars();renderComments();document.getElementById('results').style.display='block'}
 async function load(){const x=t();if(!auth.assessmentId||!auth.manageToken){status.textContent=x.missingKey;return}status.textContent=x.loading;try{[bundle,bank]=await Promise.all([C.exportCycle(auth.assessmentId,auth.cycle,auth.manageToken),GLA.loadBank()]);if(!bundle.responses?.length){status.textContent=x.empty;return}const packs=bundle.responses.map(r=>({schema:'leadership360-response@3',aid:bundle.assessment_id,role:String(r.role||'other').toUpperCase(),answers:r.answers,open:r.open||{}}));agg=GLA.aggregate(bank,packs,weights());agg.assessment_id=bundle.assessment_id;agg.cycle=bundle.cycle;agg.source_schema=bundle.schema;renderAll();status.textContent=x.loaded(bundle.responses.length)}catch(e){status.textContent=x.error+e.message}}
 document.getElementById('loadBtn').onclick=load;['wBoss','wPeers','wReports','wOthers'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{if(bundle)load()}));document.getElementById('saveAgg').onclick=()=>{if(agg)GLA.download(`leadership360_ataskaita_${auth.assessmentId}_C${auth.cycle}.json`,agg)};window.addEventListener('resize',()=>{if(bundle)renderRadar()});load();
})();
</script>
</body>
</html>
