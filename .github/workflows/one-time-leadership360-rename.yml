name: One-time Leadership 360 branding migration

on:
  push:
    branches:
      - rename/leadership-360-brand
    paths:
      - .github/workflows/one-time-leadership360-rename.yml

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/leadership-360-brand
          fetch-depth: 0

      - name: Rename public product branding only
        shell: python
        run: |
          from pathlib import Path

          html_files = list(Path('.').glob('*.html'))
          replacements = {
              'GLA360 Personal': 'Leadership 360°',
              '<h1>GLA360 – Lyderystės vertinimas</h1>': '<h1>Leadership 360° – Lyderystės vertinimas</h1>',
              '<title>GLA360 – Lyderystės vertinimas</title>': '<title>Leadership 360° – Lyderystės vertinimas</title>',
              '<title>GLA360 – Ciklų palyginimas</title>': '<title>Leadership 360° – Ciklų palyginimas</title>',
              '<title>GLA360 – Refleksija</title>': '<title>Leadership 360° – Refleksija</title>',
              '<title>GLA360 – 90 dienų tobulėjimo planas</title>': '<title>Leadership 360° – 90 dienų tobulėjimo planas</title>',
              '<title>Operatyvinės trinties auditas – GLA360</title>': '<title>Operatyvinės trinties auditas – Leadership 360°</title>',
          }

          changed = []
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Remove one-time workflow from resulting tree
        run: rm .github/workflows/one-time-leadership360-rename.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Rename public GLA360 Personal branding to Leadership 360"
          git push origin HEAD:rename/leadership-360-brand
