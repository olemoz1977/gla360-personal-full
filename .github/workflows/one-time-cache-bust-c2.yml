name: One-time C2 helper cache wiring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-cache-bust-c2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bust helper cache on C2 pages
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              'guardian.html': ('<script src="collector-client.js"></script>', '<script src="collector-client.js?v=20260821-c2-qa1"></script>'),
              'compare-v2.html': ('<script src="collector-client.js"></script>', '<script src="collector-client.js?v=20260821-c2-compare1"></script>'),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{filename}: expected script tag not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-cache-bust-c2.yml
      - name: Commit C2 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire C2 QA and comparison helpers"
          git push origin HEAD:main
