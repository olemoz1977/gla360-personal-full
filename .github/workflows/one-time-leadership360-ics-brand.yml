name: One-time Leadership 360 calendar branding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-leadership360-ics-brand.yml

permissions:
  contents: write

jobs:
  rename-calendar-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename user-visible calendar branding only
        shell: python
        run: |
          from pathlib import Path

          path = Path('plan.html')
          old = path.read_text(encoding='utf-8')
          new = old
          replacements = {
              'X-WR-CALNAME:GLA360 - ': 'X-WR-CALNAME:Leadership 360° - ',
              'SUMMARY:GLA360: ': 'SUMMARY:Leadership 360°: ',
              "'CATEGORIES:GLA360,Lyderystė'": "'CATEGORIES:Leadership 360,Lyderystė'",
              "'DESCRIPTION:GLA360 priminimas'": "'DESCRIPTION:Leadership 360° priminimas'",
          }
          for source, target in replacements.items():
              new = new.replace(source, target)
          if new == old:
              print('No calendar branding changes needed')
          else:
              path.write_text(new, encoding='utf-8')
              print('Updated user-visible ICS branding in plan.html')

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-leadership360-ics-brand.yml

      - name: Commit calendar branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rename calendar branding to Leadership 360"
          git push origin HEAD:main
