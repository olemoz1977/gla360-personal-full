name: One-time public Leadership 360 rename

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-leadership360-public-rename.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename public HTML branding
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path('.').glob('*.html'):
              old = path.read_text(encoding='utf-8')
              new = old.replace('GLA360 Personal', 'Leadership 360°')
              new = new.replace('GLA360 – ', 'Leadership 360° – ')
              new = new.replace(' – GLA360</title>', ' – Leadership 360°</title>')
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)

          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-leadership360-public-rename.yml

      - name: Commit public rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete public Leadership 360 branding rename"
          git push origin HEAD:main
