name = "leadership-360-collector"
main = "src/index.js"
compatibility_date = "2026-08-19"
workers_dev = true

[vars]
PUBLIC_SURVEY_BASE = "https://olemoz1977.github.io/gla360-personal-full/survey.html"

[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "leadership-360-identity"
database_id = "REPLACE_WITH_IDENTITY_D1_ID"

[[d1_databases]]
binding = "RESPONSE_DB"
database_name = "leadership-360-responses"
database_id = "REPLACE_WITH_RESPONSE_D1_ID"

# Enable after Cloudflare Email Service is onboarded for the sending domain:
# [[send_email]]
# name = "EMAIL"
# remote = true
#
# [vars]
# MAIL_FROM = "Leadership 360 <noreply@your-domain>"
# PUBLIC_SURVEY_BASE = "https://olemoz1977.github.io/gla360-personal-full/survey.html"
