name = "leadership-360-collector"
main = "src/bootstrap.js"
compatibility_date = "2026-08-19"
workers_dev = true

[vars]
PUBLIC_SURVEY_BASE = "https://olemoz1977.github.io/gla360-personal-full/survey-v2.html"

[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "leadership-360-identity"
database_id = "0ff9806a-3b88-476b-ad79-aa4ea392514f"

[[d1_databases]]
binding = "RESPONSE_DB"
database_name = "leadership-360-responses"
database_id = "fddd64fc-902b-4b1f-85aa-e2bc20a5a10e"

# Enable after Cloudflare Email Service is onboarded for the sending domain:
# [[send_email]]
# name = "EMAIL"
# remote = true
#
# MAIL_FROM must then be configured as a Worker variable, for example:
# Leadership 360 <noreply@your-domain>
