name = "leadership-360-collector"
main = "src/policy.js"
compatibility_date = "2026-08-19"
workers_dev = true

[vars]
PUBLIC_SURVEY_BASE = "https://olemoz1977.github.io/gla360-personal-full/survey-v2.html"
PUBLIC_GUARDIAN_BASE = "https://olemoz1977.github.io/gla360-personal-full/guardian.html"
MAIL_FROM = "Leadership 360 <noreply@2rasi.com>"

[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "leadership-360-identity"
database_id = "0ff9806a-3b88-476b-ad79-aa4ea392514f"

[[d1_databases]]
binding = "RESPONSE_DB"
database_name = "leadership-360-responses"
database_id = "fddd64fc-902b-4b1f-85aa-e2bc20a5a10e"

# Beta email transport: Resend API over HTTPS, so Workers Free is sufficient.
# Configure RESEND_API_KEY as a Worker secret; never commit it to this file.
# The 2rasi.com domain must be verified in Resend before production delivery.
#
# Optional future transport if Cloudflare Email Sending is enabled on Workers Paid:
# [[send_email]]
# name = "EMAIL"
# remote = true
