<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leadership 360° – Privacy</title><link rel="stylesheet" href="styles.css">
  <style>.topbar{max-width:900px;margin:0 auto;padding:10px 20px;display:flex;justify-content:flex-end}.lang-btn{min-width:48px;padding:7px 12px}.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{padding:12px 14px;border-left:3px solid var(--brand);background:var(--surface2);border-radius:8px}.warnbox{padding:12px 14px;border:1px solid rgba(180,83,9,.3);background:rgba(180,83,9,.05);border-radius:10px}@media(max-width:650px){.flow{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="topbar"><button id="langToggle" class="secondary lang-btn" type="button">EN</button></div>
<header class="head"><h1>Leadership 360°</h1><p id="subtitle"></p></header>
<main class="wrap">
  <section class="card"><h2 id="purposeTitle"></h2><p id="purpose"></p><div id="beta" class="warnbox" style="margin-top:12px"></div></section>
  <section class="card"><h2 id="howTitle"></h2><div class="flow"><div class="note"><strong id="identityTitle"></strong><p id="identityText"></p></div><div class="note"><strong id="responseTitle"></strong><p id="responseText"></p></div></div><p id="separation" class="muted" style="margin-top:12px"></p></section>
  <section class="card"><h2 id="collectTitle"></h2><ul id="collectList" style="padding-left:20px;line-height:1.9"></ul></section>
  <section class="card"><h2 id="notCollectTitle"></h2><ul id="notCollectList" style="padding-left:20px;line-height:1.9"></ul></section>
  <section class="card"><h2 id="visibilityTitle"></h2><ul id="visibilityList" style="padding-left:20px;line-height:1.9"></ul></section>
  <section class="card"><h2 id="anonTitle"></h2><p id="anonIntro"></p><ul id="anonList" style="padding-left:20px;line-height:1.9"></ul><div id="commentWarn" class="warnbox" style="margin-top:12px"></div></section>
  <section class="card"><h2 id="securityTitle"></h2><ul id="securityList" style="padding-left:20px;line-height:1.9"></ul></section>
  <section class="card"><h2 id="retentionTitle"></h2><p id="retention"></p><p id="deleteText" style="margin-top:8px"></p></section>
  <section class="card"><h2 id="rightsTitle"></h2><p id="rights"></p></section>
  <section class="card"><h2 id="basisTitle"></h2><p id="basis"></p></section>
</main>
<script src="v2-i18n.js"></script>
<script>
(function(){
 const I=window.Leadership360I18n;
 const COPY={
  lt:{subtitle:'Privatumas ir pseudoniminis duomenų surinkimas',purposeTitle:'Kam skirtas šis pranešimas?',purpose:'Šis puslapis aprašo Leadership 360° V2 techninį duomenų srautą vertintojui, lyderiui ir Anonimiškumo sergėtojui. Sistema skirta 360° grįžtamajam ryšiui surinkti ir palyginti per kelis ciklus.',beta:'Beta pastaba: tai techninis privatumo paaiškinimas prototipui. Organizacija, kuri realiai naudoja vertinimą, prieš komercinį ar darbuotojų vertinimo naudojimą turi pateikti savo duomenų valdytojo informaciją, teisinį pagrindą, kontaktą ir taikomą saugojimo terminą.',howTitle:'Kaip atskiriama tapatybė ir atsakymai?',identityTitle:'Identity DB – kvietimų pusė',identityText:'Saugo Assessment ID, ciklą, rolę, kalbą, užšifruotą vertintojo el. paštą, kvietimo tokeno techninius duomenis ir būseną (išsiųsta / atidaryta / užbaigta).',responseTitle:'Response DB – atsakymų pusė',responseText:'Saugo Assessment ID, ciklą, rolę, kalbą, atsakymus, neprivalomus komentarus, klausimų banko versiją ir pateikimo laiką.',separation:'Atsakymo įraše nėra vertintojo vardo, el. pašto, invite ID ar rosterio eilutės numerio. Tai pseudonimizavimas, ne absoliutus anonimizavimas.',collectTitle:'Kokie duomenys renkami?',collect:['Vertinimo kontekstas: Assessment ID ir ciklas (C1, C2 ir t. t.).','Vertintojo rolė ir pasirinkta apklausos kalba.','75 elgesio vertinimo atsakymai skalėje 1–5.','Neprivalomi laisvo teksto komentarai.','Kvietimo pusėje – el. paštas, reikalingas kvietimui ir priminimui išsiųsti.','Techninės būsenos: ar kvietimas išsiųstas, atidarytas ir užbaigtas.'],notCollectTitle:'Ko aplikacija specialiai nesaugo kartu su atsakymu?',notCollect:['Vertintojo vardo.','Vertintojo el. pašto.','Kvietimo tokeno ar invite ID.','Rosterio eilutės numerio.','Telegram identiteto ar OMESG360Bot duomenų.','Aplikacijos Response DB specialiai nerašo IP adreso ar naršyklės User-Agent. Infrastruktūros tiekėjas gali tvarkyti techninius tinklo / saugumo metaduomenis savo paslaugos veikimui.'],visibilityTitle:'Kas ką mato?',visibility:['Vertintojas mato savo kvietimo kontekstą, rolę, vertinamo lyderio vardą / projekto kontekstą ir Sergėtojo kontaktą.','Sergėtojo valdymo ekrane rodomi grupių užpildymo skaičiai, pvz. Peer 2/3, o ne „kas ką atsakė“.','Ataskaita skaito pseudoniminį ciklo paketą be el. paštų.','Raw 360° atsakymai ir vertintojų el. paštai nesiunčiami į OMESG360Bot.'],anonTitle:'Anonimiškumo ribos',anonIntro:'Pseudonimizavimas sumažina tiesioginio susiejimo riziką, tačiau kai kuriais atvejais žmogų vis tiek galima numanyti iš konteksto.',anon:['Boss / vienintelis vadovas paprastai yra natūraliai atpažįstamas.','Peer rolės lygmens interpretacijai rekomenduojama bent 3 atsakymai.','Report rolės lygmens interpretacijai rekomenduojama bent 3 atsakymai.','Other grupei rekomenduojama bent 2 atsakymai.','Kai grupė per maža, V2 ataskaita perspėja, o komentarų rolės žyma gali būti sujungiama į bendresnį „Others“ rodymą.'],commentWarn:'Laisvas tekstas gali identifikuoti autorių net be vardo. Nerašykite unikalių datų, incidentų, pareigų ar kitų detalių, kurios akivaizdžiai atskleistų, kas parašė komentarą.',securityTitle:'Techninės apsaugos',security:['Kvietimų nuorodose naudojami atsitiktiniai nepermatomi tokenai; el. paštas URL neįrašomas.','Vertintojų el. paštai ir pakartotiniam siuntimui reikalingi tokenai Identity DB numatyti šifruoti AES-GCM.','Valdymo raktas perduodamas URL fragmente (#...), o ne query parametre.','Identity DB ir Response DB yra atskiros duomenų bazės.','Valdymo API reikalauja Bearer manage token.'],retentionTitle:'Saugojimas ir ištrynimas',retention:'Dabartinėje V2 beta versijoje automatinis duomenų galiojimo terminas dar neįjungtas. Vertinimo duomenys laikomi iki tol, kol vertinimo valdytojas / Sergėtojas juos ištrina per saugią valdymo prieigą. Prieš produkcinį paleidimą organizacija turi nustatyti konkretų, kuo trumpesnį jos tikslui pagrįstą terminą.',deleteText:'Ištrynus Assessment ID, Collector numatytas ištrinti ir kvietimų / tapatybės duomenis, ir to Assessment atsakymus.',rightsTitle:'Klausimai, prieiga ar ištrynimas',rights:'Vertintojas dėl konkretaus vertinimo pirmiausia kreipiasi į kvietime nurodytą Anonimiškumo sergėtoją arba vertinimą organizuojančią organizaciją. Kadangi atsakymų bazėje nėra el. pašto ar vardo, konkretaus pseudoniminio atsakymo suradimas pagal asmens vardą gali būti techniškai neįmanomas – tai turi būti paaiškinta prieš dalyvaujant.',basisTitle:'GDPR / organizacijos atsakomybė',basis:'Leadership 360° techninė architektūra taiko duomenų minimizavimo ir atskyrimo principus, tačiau pati sistema nenustato organizacijos teisinio pagrindo. Vertinimą naudojanti organizacija turi pati įvertinti savo tikslą, teisinį pagrindą, informavimo pareigas, saugojimo terminą ir darbuotojų teises.'},
  en:{subtitle:'Privacy and pseudonymous data collection',purposeTitle:'What is this notice for?',purpose:'This page describes the Leadership 360° V2 technical data flow for evaluators, leaders and the assessment guardian. The system is designed to collect and compare 360° feedback across assessment cycles.',beta:'Beta notice: this is a technical privacy explanation for the prototype. Before commercial use or employee assessment, the organisation using it must provide its own controller information, lawful basis, contact details and applicable retention period.',howTitle:'How are identity and responses separated?',identityTitle:'Identity DB – invitation side',identityText:'Stores Assessment ID, cycle, role, language, encrypted evaluator email, technical invitation-token data and invitation state (sent / opened / completed).',responseTitle:'Response DB – response side',responseText:'Stores Assessment ID, cycle, role, language, answers, optional comments, question-bank version and submission time.',separation:'A response row does not contain evaluator name, email, invite ID or roster row number. This is pseudonymisation, not absolute anonymisation.',collectTitle:'What data is collected?',collect:['Assessment context: Assessment ID and cycle (C1, C2, etc.).','Evaluator role and selected survey language.','75 behavioural ratings on a 1–5 scale.','Optional free-text comments.','On the invitation side, an email address needed to send invitations and reminders.','Technical invitation states: sent, opened and completed.'],notCollectTitle:'What does the application deliberately not store with the response?',notCollect:['Evaluator name.','Evaluator email.','Invitation token or invite ID.','Roster row number.','Telegram identity or OMESG360Bot data.','The application does not intentionally write IP address or browser User-Agent into Response DB. The infrastructure provider may process technical network/security metadata to operate its service.'],visibilityTitle:'Who can see what?',visibility:['The evaluator sees invitation context, their role, the leader/project context and guardian contact.','The guardian management view shows group completion counts such as Peer 2/3, not “who answered what”.','The report reads a pseudonymous cycle bundle without evaluator emails.','Raw 360° responses and evaluator emails are not sent to OMESG360Bot.'],anonTitle:'Limits of anonymity',anonIntro:'Pseudonymisation reduces direct-linkage risk, but identity can still sometimes be inferred from context.',anon:['A single boss/manager is usually naturally identifiable.','At least 3 responses are recommended for peer role-level interpretation.','At least 3 responses are recommended for direct-report role-level interpretation.','At least 2 responses are recommended for the Other group.','When a group is too small, V2 reports warn the user and comment role labels can be merged into a broader “Others” presentation.'],commentWarn:'Free text may identify the author even without a name. Avoid unique dates, incidents, job details or other clues that would clearly reveal who wrote the comment.',securityTitle:'Technical safeguards',security:['Invitation links use random opaque tokens; evaluator email is not placed in the URL.','Evaluator emails and resendable invitation tokens in Identity DB are designed to be encrypted with AES-GCM.','The management key is carried in the URL fragment (#...), not in the query string.','Identity DB and Response DB are separate databases.','Management APIs require a Bearer manage token.'],retentionTitle:'Retention and deletion',retention:'Automatic expiry is not yet enabled in the current V2 beta. Assessment data is retained until the assessment manager/guardian deletes it through the secured management access. Before production use, the organisation must set a specific retention period that is no longer than necessary for its purpose.',deleteText:'Deleting an Assessment ID is designed to delete both invitation/identity data and responses belonging to that assessment.',rightsTitle:'Questions, access or deletion',rights:'For a specific assessment, evaluators should first contact the assessment guardian or the organisation named in the invitation. Because Response DB contains no email or name, locating one pseudonymous response by a person’s name may be technically impossible; participants should be informed of this before taking part.',basisTitle:'GDPR / organisational responsibility',basis:'Leadership 360° uses data-minimisation and separation principles in its technical design, but the software does not determine an organisation’s lawful basis. The organisation using the assessment must assess its purpose, lawful basis, transparency duties, retention period and participant rights.'}
 };
 let lang=new URLSearchParams(location.search).get('lang')||I.current();lang=I.set(lang);function t(){return COPY[lang]}
 function list(id,items){document.getElementById(id).innerHTML=items.map(x=>`<li>${x}</li>`).join('')}
 function render(){const x=t();document.documentElement.lang=lang;document.title='Leadership 360° – '+(lang==='lt'?'Privatumas':'Privacy');['subtitle','purposeTitle','purpose','beta','howTitle','identityTitle','identityText','responseTitle','responseText','separation','collectTitle','notCollectTitle','visibilityTitle','anonTitle','anonIntro','commentWarn','securityTitle','retentionTitle','retention','deleteText','rightsTitle','rights','basisTitle','basis'].forEach(id=>document.getElementById(id).textContent=x[id]);list('collectList',x.collect);list('notCollectList',x.notCollect);list('visibilityList',x.visibility);list('anonList',x.anon);list('securityList',x.security);const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}
 I.bindToggle(document.getElementById('langToggle'),next=>{lang=next;render()});render();
})();
</script>
</body>
</html>
