<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership 360° – Reflection</title><link rel="stylesheet" href="styles.css">
  <style>.topbar{max-width:900px;margin:0 auto;padding:10px 20px;display:flex;justify-content:flex-end}.lang-btn{min-width:48px;padding:7px 12px}.reflect-card{border-left:3px solid var(--danger)}.delta{font-size:.82rem;color:var(--danger);font-weight:700}.prompt{margin:14px 0}.prompt label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}.cause-list{display:grid;gap:8px;margin-top:10px}.cause-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}.cause-opt input{width:auto;margin-top:3px}.cause-opt strong{display:block;font-size:.88rem}.cause-opt span{font-size:.78rem;color:var(--muted)}.empty{text-align:center;padding:40px 10px;color:var(--muted)}</style>
</head>
<body>
<div class="topbar"><button id="langToggle" type="button" class="secondary lang-btn">EN</button></div>
<header class="head"><h1 id="headTitle"></h1><p id="headSub"></p></header>
<main class="wrap">
  <div id="content"></div>
  <section class="card no-print" id="finishCard" style="display:none"><button id="finishBtn" type="button"></button><p id="privacyNote" class="muted" style="font-size:.82rem;margin-top:8px"></p></section>
</main>
<script src="v2-i18n.js"></script>
<script>
(function(){
 const I=window.Leadership360I18n;let lang=I.set(I.current()),delta=null;
 try{delta=JSON.parse(sessionStorage.getItem('gla360_delta')||'null')}catch(e){}
 const COPY={lt:{head:'Leadership 360° – Refleksija',sub:'Prieš adaptuojant kitą 90 dienų planą, supraskite kas pasikeitė pablogėjusiose srityse.',empty:'Pablogėjusių sričių šiame C1/C2 palyginime nėra. Refleksijos etapas nereikalingas.',noDelta:'Nerasti C1/C2 palyginimo duomenys. Pirmiausia atlikite ciklų palyginimą.',prompts:['Kas konkrečiai pasikeitė šioje srityje per antrą ciklą?','Kokia viena konkreti situacija geriausiai parodo šį pablogėjimą?','Kuri šios situacijos dalis buvo jūsų įtakoje, o kuri – ne?','Ką kitame 90 dienų cikle darytumėte kitaip?'],cause:'Kas geriausiai paaiškina rezultatą?',causes:{circumstances:['Aplinkybės pasikeitė','Organizaciniai pokyčiai, nauja komanda, krūvis ar kiti išoriniai veiksniai turėjo didelę įtaką.'],plan_wrong:['Planas buvo netinkamas','Veiksmai buvo vykdomi, bet netiko realiai situacijai. Reikia kito požiūrio.'],plan_not_executed:['Planas nebuvo vykdytas','Veiksmai liko ketinimais, trūko laiko arba prioritetai nuolat išstūmė planą.'],other:['Kita / mišri priežastis','Situacija sudėtingesnė ir netelpa į vieną kategoriją.']},finish:'📋 Baigti refleksiją ir generuoti planą →',privacy:'Refleksijos tekstas lieka šios naršyklės sesijoje ir naudojamas tik planui adaptuoti. Jis nesiunčiamas į Collector ar Telegram.',need:'Užpildykite bent vieną konkretų sakinį ir pasirinkite priežastį kiekvienai pablogėjusiai sričiai.'},en:{head:'Leadership 360° – Reflection',sub:'Before adapting the next 90-day plan, understand what changed in the areas that regressed.',empty:'There are no regressed areas in this C1/C2 comparison. A reflection step is not required.',noDelta:'C1/C2 comparison data was not found. Run the cycle comparison first.',prompts:['What specifically changed in this area during the second cycle?','What one concrete situation best illustrates the regression?','Which part of that situation was within your influence, and which part was not?','What would you do differently in the next 90-day cycle?'],cause:'What best explains the result?',causes:{circumstances:['Circumstances changed','Organisational change, a new team, workload or other external factors had a strong effect.'],plan_wrong:['The plan was not the right fit','The actions were attempted, but they did not fit the real situation. A different approach is needed.'],plan_not_executed:['The plan was not executed','The actions stayed as intentions, time was limited, or shifting priorities displaced the plan.'],other:['Other / mixed cause','The situation is more complex and does not fit one category.']},finish:'📋 Finish reflection and generate plan →',privacy:'Reflection text remains in this browser session and is used only to adapt the plan. It is not sent to the Collector or Telegram.',need:'Write at least one concrete sentence and choose a cause for every regressed area.'}};
 const t=()=>COPY[lang];function name(n){return lang==='lt'?(window.GLA?.lt?.(n)||n):n}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function regressions(){return(delta?.items||[]).filter(i=>i.trend==='regressed')}
 function render(){const x=t();document.documentElement.lang=lang;document.title=x.head;document.getElementById('headTitle').textContent=x.head;document.getElementById('headSub').textContent=x.sub;document.getElementById('finishBtn').textContent=x.finish;document.getElementById('privacyNote').textContent=x.privacy;const items=regressions(),host=document.getElementById('content');if(!delta){host.innerHTML=`<section class="card empty">${x.noDelta}</section>`;document.getElementById('finishCard').style.display='none';return}if(!items.length){host.innerHTML=`<section class="card empty">${x.empty}<div style="margin-top:16px"><a class="btn" href="plan.html?lang=${lang}">${x.finish}</a></div></section>`;document.getElementById('finishCard').style.display='none';return}host.innerHTML=items.map((it,idx)=>`<section class="card reflect-card" data-idx="${idx}"><h2>${esc(name(it.name))}</h2><div class="delta">C1 ${it.c1_others===null?'—':Number(it.c1_others).toFixed(2)} → C2 ${it.c2_others===null?'—':Number(it.c2_others).toFixed(2)} · Δ ${it.delta_others>=0?'+':''}${Number(it.delta_others).toFixed(2)}</div>${x.prompts.map((p,qi)=>`<div class="prompt"><label>${qi+1}. ${p}</label><textarea data-q="${qi}" rows="3"></textarea></div>`).join('')}<div style="margin-top:14px"><strong>${x.cause}</strong><div class="cause-list">${Object.entries(x.causes).map(([value,[label,desc]])=>`<label class="cause-opt"><input type="radio" name="cause_${idx}" value="${value}"><div><strong>${label}</strong><span>${desc}</span></div></label>`).join('')}</div></div></section>`).join('');document.getElementById('finishCard').style.display='block'}
 function snapshot(){const items=regressions();return items.map((item,idx)=>{const card=document.querySelector(`[data-idx="${idx}"]`),reflections=[...card.querySelectorAll('textarea')].map(x=>x.value.trim()),cause=card.querySelector(`input[name="cause_${idx}"]:checked`)?.value||'';return{item,reflections,cause}})}
 I.bindToggle(document.getElementById('langToggle'),next=>{const old=snapshot();lang=next;render();old.forEach((s,idx)=>{const card=document.querySelector(`[data-idx="${idx}"]`);if(!card)return;[...card.querySelectorAll('textarea')].forEach((el,qi)=>el.value=s.reflections[qi]||'');if(s.cause){const r=card.querySelector(`input[value="${s.cause}"]`);if(r)r.checked=true}})});render();
 document.getElementById('finishBtn').onclick=()=>{const x=t(),snap=snapshot();if(snap.some(s=>!s.cause||!s.reflections.some(Boolean))){alert(x.need);return}const result={schema:'gla360-reflect@1',completedAt:new Date().toISOString().slice(0,10),items:snap.map(s=>({name:s.item.name,cluster:s.item.cluster,delta:s.item.delta_others,c1:s.item.c1_others,c2:s.item.c2_others,reflections:s.reflections,cause:s.cause,causeText:''}))};sessionStorage.setItem('gla360_reflect',JSON.stringify(result));location.href='plan.html?lang='+encodeURIComponent(lang)};
})();
</script>
<script src="app.js"></script>
</body>
</html>
