<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leadership 360° – Organizacijos analitika</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .topbar{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;justify-content:flex-end}.hero-note{max-width:900px;margin:0 auto}.analytics-wrap{max-width:1100px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.stat{border:1px solid var(--border);border-radius:12px;background:var(--surface2);padding:14px;text-align:center}.stat .n{font-size:1.6rem;font-weight:750}.stat .lbl{font-size:.76rem;color:var(--muted);margin-top:4px}.upload{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.upload label{flex:1 1 320px}.signal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.signal{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface2)}.signal h3{margin:0 0 8px;font-size:1rem}.signal .meta{font-size:.78rem;color:var(--muted)}.tag{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:.72rem;font-weight:700}.table-wrap{overflow:auto}.analytics-table{width:100%;border-collapse:collapse;font-size:.82rem}.analytics-table th,.analytics-table td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.analytics-table th{font-size:.72rem;color:var(--muted)}.analytics-table td:first-child{white-space:normal;min-width:190px}.muted-box{border:1px dashed var(--border);border-radius:12px;padding:12px;color:var(--muted);font-size:.84rem}.section-sub{margin-top:-5px}.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}.progress>div{height:100%;background:var(--brand)}.role-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.role{border:1px solid var(--border);border-radius:10px;padding:10px}.role strong{display:block}.privacy{border-left:3px solid var(--brand);padding:12px 14px;background:var(--surface2);border-radius:8px}@media(max-width:760px){.stats,.signal-grid,.role-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.analytics-table thead{display:none}.analytics-table,.analytics-table tbody,.analytics-table tr,.analytics-table td{display:block;width:100%}.analytics-table tr{box-sizing:border-box;border:1px solid var(--border);border-radius:12px;margin:0 0 10px;padding:10px;background:var(--surface2)}.analytics-table td{box-sizing:border-box;border:0;padding:4px 0;white-space:normal;display:grid;grid-template-columns:minmax(118px,42%) 1fr;gap:8px;align-items:start}.analytics-table td::before{content:attr(data-label);font-size:.72rem;color:var(--muted);font-weight:700}.analytics-table td:first-child{display:block;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:6px}.analytics-table td:first-child::before{display:none}}@media(max-width:480px){.stats,.signal-grid,.role-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="topbar"><button id="langToggle" class="secondary" type="button">EN</button></div>
<header class="head"><h1 id="title"></h1><p id="subtitle"></p></header>
<main class="wrap analytics-wrap">
  <section class="card">
    <h2 id="purposeTitle"></h2>
    <p id="purposeText" class="muted"></p>
    <div class="privacy" id="privacyText"></div>
  </section>

  <section class="card no-print">
    <h2 id="dataTitle"></h2>
    <p id="dataText" class="muted"></p>
    <div class="upload">
      <label><span id="fileLabel"></span><input id="files" type="file" accept="application/json,.json" multiple></label>
      <button id="loadFiles" type="button"></button>
      <button id="demoBtn" class="secondary" type="button"></button>
      <button id="clearBtn" class="secondary" type="button"></button>
    </div>
    <div id="loadState" class="muted" style="margin-top:10px"></div>
  </section>

  <div id="results" style="display:none">
    <section class="card">
      <h2 id="participationTitle"></h2><p id="participationSub" class="muted section-sub"></p>
      <div id="participationStats" class="stats"></div>
      <div id="roles"></div>
      <div id="participationMissing" class="muted-box" style="display:none;margin-top:12px"></div>
    </section>

    <section class="card">
      <h2 id="signalsTitle"></h2><p id="signalsSub" class="muted section-sub"></p>
      <div id="signals" class="signal-grid"></div>
    </section>

    <section class="card">
      <h2 id="clustersTitle"></h2>
      <div id="clusters" class="signal-grid"></div>
    </section>

    <section class="card">
      <h2 id="detailTitle"></h2><p id="detailSub" class="muted section-sub"></p>
      <div class="table-wrap"><table class="analytics-table"><thead id="detailHead"></thead><tbody id="detailBody"></tbody></table></div>
    </section>

    <section class="card no-print">
      <h2 id="exportTitle"></h2><p id="exportText" class="muted"></p>
      <button id="exportBtn" type="button"></button>
    </section>
  </div>
</main>
<script src="app.js"></script>
<script src="organization-analytics.js"></script>
<script>
(function(){
  const A=window.Leadership360OrgAnalytics;
  const q=new URLSearchParams(location.search).get('lang');
  let stored='';try{stored=localStorage.getItem('leadership360_ui_lang')||''}catch(_){}
  let lang=String(q||stored||navigator.language||'lt').toLowerCase().startsWith('en')?'en':'lt';
  let snapshots=[],participation=null,summary=null;
  const COPY={
    lt:{title:'Leadership 360° · Organizacijos analitika',sub:'Programos įsitraukimas ir pasikartojantys organizaciniai signalai',purposeTitle:'Ką analizuoja šis sluoksnis?',purpose:'Jis atsako ne „ką atsakė konkretus žmogus?“, o „kas kartojasi organizacijoje ir ar 360° programa realiai vyksta?“. Rodomi dalyvavimo, kompetencijų, savivertinimo ir kitų vertinimo nesutapimų bei C1→C2 tęstinumo signalai.',privacy:'Tai nėra Sergėtojo ekranas. Organizacijos analitika neturi gauti individualių atsakymų, atvirų komentarų, vertintojų tapatybių ar „peržiūrėti kaip vertinamasis“ teisės. Mažos imtys slopinamos.',dataTitle:'Prototipo duomenų šaltinis',data:'Dabar galima įkelti kelis jau apibendrintus Leadership 360° ataskaitų JSON ir, jei turite, atskirą dalyvavimo JSON. Tai leidžia testuoti Pattern Engine neperduodant žalių atsakymų. Produkcijoje šiuos agregatus turi pateikti serverio organizacijos sluoksnis.',file:'Apibendrinti JSON failai',load:'Analizuoti failus',demo:'Įkelti sintetinį demo',clear:'Išvalyti',loaded:(a,p)=>`Įkelta vertinimų ciklų: ${a}. Dalyvavimo duomenys: ${p?'taip':'ne'}.`,bad:n=>`Nepavyko atpažinti ${n} failo(-ų).`,participationTitle:'Programos įsitraukimas',participationSub:'Įsitraukimas rodomas kaip skaidri etapų seka, o ne vienas „maginis“ balas.',missingParticipation:'Dalyvavimo duomenų nėra. Kompetencijų signalai vis tiek skaičiuojami, tačiau planuota → pakviesta → atidaryta → užbaigta etapų seka nerodoma.',stats:{plannedAssessments:'Planuota vertinimų',completedAssessments:'Užbaigta vertinimų',inviteCompletion:'Vertintojų užbaigimas',c2:'C2 tęstinumas'},roles:'Pagal vertintojo santykį',signalsTitle:'Organizaciniai signalai',signalsSub:'Heuristinė kryptis, ne diagnozė. „Organizacinis signalas“ reiškia, kad prieš siunčiant žmones į mokymus verta patikrinti sistemą, procesus ir kultūrines praktikas.',clustersTitle:'Sritys',detailTitle:'Kompetencijų detalė',detailSub:'Savęs–kitų skirtumas = savivertinimas − kitų vertinimas. Teigiamas skaičius reiškia, kad savivertinimas vidutiniškai aukštesnis.',head:['Kompetencija','n','Kitų vid.','Savęs–kitų skirt.','Žemų rezultatų %','Galimos aklos zonos %','C1→C2','Signalas'],exportTitle:'Eksportas',exportText:'Eksportuojama tik organizacijos lygio santrauka. Žali atsakymai ir komentarai čia nepatenka.',export:'Atsisiųsti analitikos JSON',types:{systemic:'Organizacinio konteksto signalas',development:'Mokymų / ugdymo kryptis',attention:'Reikia dėmesio',strength:'Organizacijos stiprybė',neutral:'Aiškaus signalo nėra',suppressed:'Nepakanka duomenų'},actions:{systemic:'Patikrinti sistemines kliūtis, vadovavimo normas ir kultūrines praktikas. Mokymus taikyti tik kartu su priežasties patikra.',development:'Tikslingas ugdymas ar praktinis mokymas gali būti pagrįsta kryptis.',attention:'Rinkti daugiau konteksto ir stebėti kitą ciklą prieš darant organizacijos lygio išvadą.',strength:'Išlaikyti ir skleisti veikiančias praktikas tarp komandų.',neutral:'Stebėti be intervencijos.',suppressed:'Nerodyti organizacinės interpretacijos, kol nepasiekta minimali imtis.'},confidence:{high:'aukštas',medium:'vidutinis',directional:'kryptinis',insufficient:'nepakankamas'},band:{strong:'stiprus',moderate:'vidutinis',attention:'reikia dėmesio',unknown:'nėra duomenų'},role:{boss:'Vadovas',peer:'Kolegos',report:'Pavaldiniai',other:'Kiti',self:'Savivertinimas'}},
    en:{title:'Leadership 360° · Organisation analytics',sub:'Programme participation and recurring organisational signals',purposeTitle:'What does this layer analyse?',purpose:'It does not ask “what did one person answer?” but “what repeats across the organisation and is the 360° programme actually moving?”. It combines participation, competency, Self–Others gap and C1→C2 continuity signals.',privacy:'This is not the Guardian view. Organisation analytics must not receive individual responses, open comments, evaluator identities or “view as assessed leader” access. Small samples are suppressed.',dataTitle:'Prototype data source',data:'For now, load multiple already-aggregated Leadership 360° report JSON files and, optionally, a separate participation JSON. This lets us test the Pattern Engine without passing raw responses. In production these aggregates must come from the server-side organisation layer.',file:'Aggregate JSON files',load:'Analyse files',demo:'Load synthetic demo',clear:'Clear',loaded:(a,p)=>`Assessment cycles loaded: ${a}. Participation data: ${p?'yes':'no'}.`,bad:n=>`${n} file(s) could not be recognised.`,participationTitle:'Programme participation',participationSub:'Engagement is shown as a transparent funnel rather than one opaque score.',missingParticipation:'No participation package was loaded. Competency signals are still available, but the planned → invited → opened → completed funnel cannot be shown.',stats:{plannedAssessments:'Assessments planned',completedAssessments:'Assessments completed',inviteCompletion:'Evaluator completion',c2:'C2 continuity'},roles:'By evaluator relationship',signalsTitle:'Organisational signals',signalsSub:'Directional heuristic, not a diagnosis. An “organisational signal” means the system, processes and cultural practices should be checked before defaulting to training.',clustersTitle:'Clusters',detailTitle:'Competency detail',detailSub:'Self gap = Self − Others. A positive number means self-ratings are higher on average.',head:['Competency','n','Others','Self gap','Low results %','Possible blind spots %','C1→C2','Signal'],exportTitle:'Export',exportText:'Only the organisation-level summary is exported. Raw answers and open comments are excluded.',export:'Download analytics JSON',types:{systemic:'Organisational context signal',development:'Learning / development direction',attention:'Needs attention',strength:'Organisational strength',neutral:'No clear signal',suppressed:'Insufficient data'},actions:{systemic:'Check systemic barriers, leadership norms and cultural practices. Use training only together with root-cause validation.',development:'Targeted development or practical training may be a reasonable direction.',attention:'Collect more context and observe another cycle before making an organisation-level conclusion.',strength:'Maintain and spread the practices that work across teams.',neutral:'Monitor without intervention.',suppressed:'Do not show an organisational interpretation until minimum coverage is reached.'},confidence:{high:'high',medium:'medium',directional:'directional',insufficient:'insufficient'},band:{strong:'strong',moderate:'moderate',attention:'needs attention',unknown:'no data'},role:{boss:'Manager',peer:'Peers',report:'Direct reports',other:'Others',self:'Self'} }
  };
  const t=()=>COPY[lang];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2);
  const rate=v=>v===null||v===undefined?'—':Math.round(Number(v)*100)+'%';
  const typeLabel=x=>t().types[x]||x;
  const displayName=name=>lang==='lt'?GLA.lt(name):name;
  const pairLabel=n=>lang==='lt'?`${n} ${n===1?'pora':'porų'}`:`${n} ${n===1?'pair':'pairs'}`;
  const competencyCount=n=>lang==='lt'?`${n} ${n===1?'kompetencija':((n%10>=2&&n%10<=9&&!(n%100>=11&&n%100<=19))?'kompetencijos':'kompetencijų')}`:`${n} ${n===1?'competency':'competencies'}`;
  const roleLabel=role=>t().role?.[role]||role;

  function setLang(next){lang=next;try{localStorage.setItem('leadership360_ui_lang',lang)}catch(_){}const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);renderStatic();if(summary)render()}
  document.getElementById('langToggle').onclick=()=>setLang(lang==='lt'?'en':'lt');
  function renderStatic(){const x=t();document.documentElement.lang=lang;document.title=x.title;document.getElementById('langToggle').textContent=lang==='lt'?'EN':'LT';['title','subtitle','purposeTitle','dataTitle','participationTitle','participationSub','signalsTitle','signalsSub','clustersTitle','detailTitle','detailSub','exportTitle','exportText'].forEach(id=>document.getElementById(id).textContent=x[id==='subtitle'?'sub':id]);document.getElementById('purposeText').textContent=x.purpose;document.getElementById('privacyText').textContent=x.privacy;document.getElementById('dataText').textContent=x.data;document.getElementById('fileLabel').textContent=x.file;document.getElementById('loadFiles').textContent=x.load;document.getElementById('demoBtn').textContent=x.demo;document.getElementById('clearBtn').textContent=x.clear;document.getElementById('exportBtn').textContent=x.export}

  function stat(value,label,sub=''){return `<div class="stat"><div class="n">${esc(value)}</div><div class="lbl">${esc(label)}</div>${sub?`<div class="muted" style="font-size:.68rem;margin-top:4px">${esc(sub)}</div>`:''}</div>`}
  function renderParticipation(){const x=t(),p=summary.participation,host=document.getElementById('participationStats'),missing=document.getElementById('participationMissing'),roles=document.getElementById('roles');if(!p.available){host.innerHTML=stat(summary.coverage.current_assessments,x.stats.completedAssessments);missing.textContent=x.missingParticipation;missing.style.display='block';roles.innerHTML='';return}missing.style.display='none';host.innerHTML=stat(p.assessments.planned||'—',x.stats.plannedAssessments)+stat(p.assessments.completed||'—',x.stats.completedAssessments,rate(p.assessments.completion_rate))+stat(rate(p.invitations.completion_rate),x.stats.inviteCompletion,x.band[p.band])+stat(rate(p.c2.continuity_rate),x.stats.c2);const entries=Object.entries(p.by_role||{});roles.innerHTML=entries.length?`<h3 style="margin-top:16px">${esc(x.roles)}</h3><div class="role-grid">${entries.map(([role,b])=>`<div class="role"><strong>${esc(roleLabel(role))}</strong><span class="muted">${b.completed||0}/${b.sent||b.planned||0} · ${rate((b.sent||b.planned)?b.completed/(b.sent||b.planned):null)}</span></div>`).join('')}</div>`:''}
  function signalCard(c){const x=t(),trend=c.trend?.pairs?`${pairLabel(c.trend.pairs)} · ${c.trend.mean_delta>=0?'+':''}${fmt(c.trend.mean_delta)}`:'—';const othersLabel=lang==='lt'?'Kitų vid.':'Others',gapLabel=lang==='lt'?'Savęs–kitų skirt.':'Self gap';return `<div class="signal"><div class="tag">${esc(typeLabel(c.signal.type))}</div><h3>${esc(displayName(c.name))}</h3><div class="meta">n=${c.n} · ${othersLabel} ${fmt(c.others_mean)} · ${gapLabel} ${c.signed_gap_mean>0?'+':''}${fmt(c.signed_gap_mean)} · C1→C2 ${esc(trend)} · ${esc(x.confidence[c.confidence]||c.confidence)}</div><p style="margin-bottom:0">${esc(x.actions[c.signal.type])}</p></div>`}
  function renderSignals(){const focus=summary.competencies.filter(c=>['systemic','development','attention','strength'].includes(c.signal.type)).slice(0,8);document.getElementById('signals').innerHTML=focus.length?focus.map(signalCard).join(''):`<div class="muted-box">${esc(t().types.neutral)}</div>`}
  function renderClusters(){const othersLabel=lang==='lt'?'Kitų vid.':'Others';document.getElementById('clusters').innerHTML=summary.clusters.map(c=>`<div class="signal"><h3>${esc(displayName(c.name))}</h3><div class="meta">${othersLabel} ${fmt(c.others_mean)} · ${competencyCount(c.competencies)}</div><p style="margin-bottom:0">${esc(t().types.systemic)}: ${c.systemic_signals} · ${esc(t().types.development)}: ${c.development_signals} · ${esc(t().types.attention)}: ${c.attention_signals} · ${esc(t().types.strength)}: ${c.strengths}</p></div>`).join('')}
  function renderDetail(){const x=t();document.getElementById('detailHead').innerHTML='<tr>'+x.head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';document.getElementById('detailBody').innerHTML=summary.competencies.map(c=>{const suppressed=c.signal.type==='suppressed';const trend=c.trend?.pairs?`${c.trend.mean_delta>=0?'+':''}${fmt(c.trend.mean_delta)} (${pairLabel(c.trend.pairs)})`:'—';const values=[`<strong>${esc(displayName(c.name))}</strong><div class="muted">${esc(displayName(c.cluster))}</div>`,c.n,suppressed?'—':fmt(c.others_mean),suppressed?'—':((c.signed_gap_mean>0?'+':'')+fmt(c.signed_gap_mean)),suppressed?'—':rate(c.low_rate),suppressed?'—':rate(c.blind_spot_rate),suppressed?'—':esc(trend),`<span class="tag">${esc(typeLabel(c.signal.type))}</span>`];return '<tr>'+values.map((v,i)=>`<td data-label="${esc(x.head[i])}">${v}</td>`).join('')+'</tr>'}).join('')}
  function render(){document.getElementById('results').style.display='block';renderParticipation();renderSignals();renderClusters();renderDetail()}
  function analyse(){summary=A.analyse(snapshots,participation);render();document.getElementById('loadState').textContent=t().loaded(snapshots.length,!!participation)}

  async function parseFiles(files){let bad=0;for(const file of files){try{const obj=JSON.parse(await file.text());const items=Array.isArray(obj)?obj:[obj];for(const item of items){if(item?.schema===A.PARTICIPATION_SCHEMA){participation=item;continue}if(item?.schema===A.SNAPSHOT_SCHEMA||item?.bank&&item?.means&&item?.others){snapshots.push(A.normaliseSnapshot(item));continue}if(item?.participation){participation=A.normaliseParticipation(item.participation);if(Array.isArray(item.assessments))snapshots.push(...item.assessments.map(A.normaliseSnapshot));continue}bad++}}catch(_){bad++}}analyse();if(bad)document.getElementById('loadState').textContent+=' '+t().bad(bad)}
  document.getElementById('loadFiles').onclick=()=>{snapshots=[];participation=null;parseFiles([...document.getElementById('files').files])};
  document.getElementById('clearBtn').onclick=()=>{snapshots=[];participation=null;summary=null;document.getElementById('files').value='';document.getElementById('results').style.display='none';document.getElementById('loadState').textContent=''};
  document.getElementById('exportBtn').onclick=()=>{if(!summary)return;const blob=new Blob([JSON.stringify(summary,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leadership360_organization_analytics.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

  async function demo(){const bank=await fetch('bank/questions.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());snapshots=[];const dep=['Operations','Operations','Operations','Supply','Supply','Supply','Quality','Quality','Quality','Commercial','Commercial','Commercial'];for(let i=0;i<12;i++){const c1Self=[],c1Other=[],c2Self=[],c2Other=[];bank.competencies.forEach((c,idx)=>{let o=3.65+((i+idx)%4)*0.08,s=o+0.15;const key=c.items?.[0]?.key||'';if(key.startsWith('COMM_DIA')){o=2.85+(i%3)*0.08;s=3.75;c2Other.push(o+0.08);c2Self.push(3.72)}else if(key.startsWith('ENG_SLD')){o=3.00+(i%4)*0.10;s=3.30;c2Other.push(o+0.40);c2Self.push(3.45)}else if(key.startsWith('CHG_LEAD')){o=3.00+(i%3)*0.05;s=3.20;c2Other.push(o+0.13);c2Self.push(3.30)}else if(key.startsWith('INC_EMP')){o=3.48+(i%3)*0.05;s=4.28;c2Other.push(o+0.05);c2Self.push(4.30)}else if(key.startsWith('ASS_CUST')){o=4.05+(i%3)*0.05;s=4.10;c2Other.push(o+0.10);c2Self.push(4.12)}else{c2Other.push(Math.min(4.4,o+0.12));c2Self.push(Math.min(4.45,s+0.08))}c1Other.push(o);c1Self.push(s)});const mk=(cycle,self,others)=>A.fromAggregate({assessment_id:'DEMO-'+String(i+1).padStart(2,'0'),cycle,bank,means:{self},others,packsCount:7},{segment:{department:dep[i]}});snapshots.push(mk(1,c1Self,c1Other),mk(2,c2Self,c2Other))}participation={schema:A.PARTICIPATION_SCHEMA,campaign_id:'DEMO-Q4',assessments:{planned:12,started:12,completed:11},invitations:{planned:96,sent:94,opened:84,completed:78},c2:{eligible:11,started:10,completed:9},by_role:{boss:{planned:12,sent:12,opened:11,completed:11},peer:{planned:36,sent:35,opened:31,completed:29},report:{planned:36,sent:35,opened:31,completed:28},other:{planned:12,sent:12,opened:11,completed:10}}};analyse();document.getElementById('loadState').textContent=t().loaded(snapshots.length,true)+' DEMO.'}
  document.getElementById('demoBtn').onclick=()=>demo().catch(e=>document.getElementById('loadState').textContent=e.message);
  renderStatic();
})();
</script>
</body>
</html>
