<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leadership 360° – 90 dienų tobulėjimo planas</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0f17;color:#e8edf5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#a9b4c4}
  </style>
</head>
<body>
  <div class="loading" id="loading">Kraunamas Leadership 360° planas…</div>
  <script>
  (async function(){
    try {
      const response = await fetch('plan-core.html?v=20260818-bot-sync', { cache:'no-store' });
      if(!response.ok) throw new Error('HTTP ' + response.status);
      let html = await response.text();

      const appTag = '<scr' + 'ipt src="app.js"></scr' + 'ipt>';
      const syncTag = '<scr' + 'ipt src="bot-sync.js"></scr' + 'ipt>\n' + appTag;
      html = html.replace(appTag, syncTag);

      const newBotCard = `    <section class="card" id="botCard" style="display:none;">
      <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;">
        <div style="font-size:2.5rem;line-height:1;">🤖</div>
        <div style="flex:1;">
          <h2 style="margin-bottom:6px;">OMESG360Bot – 90 dienų plano palydovas</h2>
          <p class="muted" style="margin-bottom:14px;">Kalendorius rodo visą planą. Botas seka tik 1–3 svarbiausius pažadus ir primena apie juos be papildomo planavimo sluoksnio.</p>
          <div style="background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:14px;font-size:.9rem;">
            <strong>Kaip perduoti:</strong>
            <ol style="margin:8px 0 0 18px;line-height:2;">
              <li>Plane varnelėmis pažymėkite 1–3 veiksmus, kuriuos norite sekti.</li>
              <li>Spauskite „Perduoti į Telegram“.</li>
              <li>Telegram atsidarys @OMESG360Bot ir prijungs būtent tuos veiksmus.</li>
            </ol>
          </div>
          <button id="botSyncBtn" type="button">📲 Perduoti 1–3 veiksmus į Telegram</button>
          <p id="botSyncStatus" class="muted" style="font-size:.82rem;margin-top:10px;">Į botą perduodami tik pasirinktų veiksmų tekstai, fazė ir priminimo datos. 360° atsakymai ir komentarai nesiunčiami. Perdavimo nuoroda galioja 30 min.</p>
          <a id="botLink" href="https://t.me/OMESG360Bot" style="display:none" aria-hidden="true"></a>
          <div id="botSummaryBox" style="display:none"><div id="botCompList"></div></div>
        </div>
      </div>
    </section>`;

      html = html.replace(
        /    <section class="card" id="botCard"[\s\S]*?<\/section>/,
        newBotCard
      );

      const newWiring = `    // Bot handoff uses the same checked plan actions as calendar export.
    const botCard = document.getElementById('botCard');
    if(botCard) botCard.style.display = 'block';

    wireCalendarExport(leader);
    if(window.Leadership360BotSync){
      window.Leadership360BotSync.wire({ startDate: planStartDate });
    }`;

      html = html.replace(
        /    \/\/ Bot card\n[\s\S]*?    wireCalendarExport\(leader\);/,
        newWiring
      );

      html = html.replace(
        "const fname = `GLA360_${leader.replace(/\\s+/g,'_')}_90d.ics`;",
        "const fname = `Leadership360_${leader.replace(/\\s+/g,'_')}_90d.ics`;"
      );

      document.open();
      document.write(html);
      document.close();
    } catch(error) {
      document.getElementById('loading').textContent = 'Nepavyko įkelti 90 dienų plano. Perkraukite puslapį.';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
