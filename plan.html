<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership 360° – 90 dienų tobulėjimo planas</title>
  <style>html,body{margin:0;min-height:100%;background:#0b0f17;color:#e8edf5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#a9b4c4}</style>
</head>
<body>
  <div class="loading" id="loading">Kraunamas Leadership 360° planas…</div>
  <script>
  (async function(){
    const qs = new URLSearchParams(location.search);
    const requested = String(qs.get('lang') || localStorage.getItem('leadership360_ui_lang') || navigator.language || 'lt').toLowerCase();
    if(requested.startsWith('en')){
      localStorage.setItem('leadership360_ui_lang','en');
      const target = new URL('plan-en.html', location.href);
      target.searchParams.set('lang','en');
      target.hash=location.hash;
      location.replace(target.toString());
      return;
    }
    localStorage.setItem('leadership360_ui_lang','lt');
    document.documentElement.lang='lt';
    try {
      const response = await fetch('plan-core.html?v=20260821-cycle-direct-4', { cache:'no-store' });
      if(!response.ok) throw new Error('HTTP ' + response.status);
      let html = await response.text();

      const appTag = '<scr' + 'ipt src="app.js"></scr' + 'ipt>';
      const syncTag = '<scr' + 'ipt src="bot-sync.js?v=20260819-bot-sync-v4"></scr' + 'ipt>\n'
        + appTag + '\n'
        + '<scr' + 'ipt src="collector-client.js?v=20260821-plan-3"></scr' + 'ipt>\n'
        + '<scr' + 'ipt src="plan-cycle.js?v=20260821-context-1"></scr' + 'ipt>\n'
        + '<scr' + 'ipt src="plan-priority-guard.js?v=20260821-1"></scr' + 'ipt>\n'
        + '<scr' + 'ipt src="plan-export-fixes.js?v=20260820-1"></scr' + 'ipt>';
      html = html.replace(appTag, syncTag);

      const calendarButton = '<button id="exportIcs" type="button">📅 Eksportuoti į kalendorių (.ics)</button>';
      const telegramButton = '<button id="botSyncBtn" type="button" class="secondary">📲 Perduoti į Telegram</button>';
      html = html.replace(calendarButton, calendarButton + '\n          ' + telegramButton);

      const newBotCard = `    <section class="card" id="botCard" style="display:none;">
      <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;">
        <div style="font-size:2.5rem;line-height:1;">🤖</div>
        <div style="flex:1;">
          <h2 style="margin-bottom:6px;">OMESG360Bot – 90 dienų plano palydovas</h2>
          <p class="muted" style="margin-bottom:14px;">Kalendorius rodo visą planą. Botas seka tik 1–3 svarbiausius pažymėtus veiksmus.</p>
          <p id="botSyncStatus" class="muted" style="font-size:.82rem;margin-top:10px;">Pažymėkite 1–3 veiksmus ir spauskite „📲 Perduoti į Telegram“. Į botą nesiunčiami 360° atsakymai, komentarai ar vertintojų duomenys.</p>
          <a id="botLink" href="https://t.me/OMESG360Bot" style="display:none" aria-hidden="true"></a>
          <div id="botSummaryBox" style="display:none"><div id="botCompList"></div></div>
        </div>
      </div>
    </section>`;
      html = html.replace(/    <section class="card" id="botCard"[\s\S]*?<\/section>/, newBotCard);

      const newWiring = `    const botCard = document.getElementById('botCard');
    if(botCard) botCard.style.display = 'block';
    wireCalendarExport(leader);
    if(window.Leadership360BotSync){
      window.Leadership360BotSync.wire({ startDate: planStartDate });
    }`;
      html = html.replace(/    \/\/ Bot card\n[\s\S]*?    wireCalendarExport\(leader\);/, newWiring);
      html = html.replace("const fname = `GLA360_${leader.replace(/\\s+/g,'_')}_90d.ics`;", "const fname = `Leadership360_${leader.replace(/\\s+/g,'_')}_90d.ics`;");

      document.open();document.write(html);document.close();
    } catch(error) {
      document.getElementById('loading').textContent = 'Nepavyko įkelti 90 dienų plano. Perkraukite puslapį.';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
